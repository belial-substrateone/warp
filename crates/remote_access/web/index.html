<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self' wss:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0d1117">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>AnonWarp Remote</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/vendor/xterm.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="app">
  <!-- Message / pairing / error screen -->
  <section id="screen-message" class="screen" hidden>
    <div class="card">
      <h1 id="msg-title"></h1>
      <p id="msg-text"></p>
      <div id="msg-fp" class="fp" hidden>
        <p class="small">Compare this fingerprint with the one shown on your PC:</p>
        <code id="msg-fp-value"></code>
      </div>
      <div id="msg-spinner" class="spinner" hidden></div>
      <div id="msg-actions" class="actions"></div>
    </div>
  </section>

  <!-- Terminal screen -->
  <section id="screen-main" class="screen" hidden>
    <header id="statusbar" data-state="connecting">
      <span id="conn-dot" class="dot" aria-hidden="true"></span>
      <span id="conn-text" role="status" aria-live="polite">Connecting</span>
      <span id="conn-latency" class="muted"></span>
      <span class="spacer"></span>
      <button id="btn-menu" type="button" aria-haspopup="dialog">Menu</button>
    </header>
    <nav id="tabbar" aria-label="Tabs"></nav>
    <nav id="panebar" aria-label="Panes" hidden></nav>
    <div id="term-wrap"><div id="term"></div></div>
    <div id="toolbar" role="toolbar" aria-label="Keys"></div>
  </section>

  <!-- Menu sheet -->
  <div id="sheet-backdrop" hidden></div>
  <div id="sheet" role="dialog" aria-modal="true" aria-label="Menu" hidden>
    <div class="sheet-row">
      <span>Font size</span>
      <button id="font-dec" type="button" aria-label="Smaller font">A-</button>
      <output id="font-val">14</output>
      <button id="font-inc" type="button" aria-label="Larger font">A+</button>
      <button id="font-fit" type="button">Fit width</button>
    </div>
    <div class="sheet-row" id="row-phone-resize" hidden>
      <button id="btn-phone-resize" type="button">Resize PC pane to fit phone</button>
    </div>
    <div class="sheet-grid">
      <button id="act-newtab" type="button">New tab</button>
      <button id="act-split-right" type="button">Split right</button>
      <button id="act-split-down" type="button">Split down</button>
      <button id="act-close-pane" type="button" class="danger">Close pane</button>
      <button id="act-close-tab" type="button" class="danger">Close tab</button>
      <button id="act-reconnect" type="button">Reconnect now</button>
      <button id="act-disconnect" type="button">Disconnect</button>
      <button id="act-unpair" type="button" class="danger">Forget this PC</button>
    </div>
    <p id="sheet-info" class="small muted"></p>
    <button id="sheet-close" type="button" class="primary">Close</button>
  </div>
</div>
<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-fit.js"></script>
<script src="/vendor/addon-web-links.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
